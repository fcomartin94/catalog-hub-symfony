# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Controllers used by custom API Platform operations (e.g. the store
    # sync endpoint) need this tag so Symfony's controller resolver can
    # invoke them the same way it invokes controllers reached via normal
    # routing — this project has no traditional routed controllers, so it
    # was never declared until the sync endpoint needed it.
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # Named service ID (not the bare interface) that the two sync connectors
    # depend on, bound explicitly below. Tests override this specific
    # service ID with a MockHttpClient — using a dedicated ID instead of
    # aliasing the shared HttpClientInterface avoids touching the client
    # used by unrelated parts of the framework (JWT key fetching, etc. use
    # HttpClientInterface too, so replacing it globally would be riskier
    # than necessary for what these tests actually need to control).
    store_sync.http_client:
        alias: 'http_client'
        public: false

    App\Sync\PrestaShopSyncConnector:
        arguments:
            $httpClient: '@store_sync.http_client'

    App\Sync\WooCommerceSyncConnector:
        arguments:
            $httpClient: '@store_sync.http_client'

when@test:
    services:
        Symfony\Component\PasswordHasher\Hasher\UserPasswordHasherInterface:
            public: true

        store_sync.http_client:
            alias: 'http_client'
            public: true